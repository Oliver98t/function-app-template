[project]
name = "function-app-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-functions>=1.21.0,<2.0.0",
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-azure-native>=3.0.0,<4.0.0",
    "azure-pulumi-components @ git+https://github.com/Oliver98t/azure-pulumi-components.git@main",
]

[dependency-groups]
dev = [
    "azure-functions>=1.21.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
